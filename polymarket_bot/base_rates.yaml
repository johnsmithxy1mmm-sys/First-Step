# Base-rates reference for estimating tail outcomes.
# Record format:
#   name: identifier
#   keywords_all: words that must ALL appear in the question (lowercase)
#   keywords_any: at least one of these must appear (empty = do not check)
#   annual_probability: probability the event happens within a year (0..1)
#   confidence: how much we trust this estimate as a signal (0..1)
#   note: source/justification
#
# p_est for a market "will X happen by date D" = 1 - (1 - annual_probability)^(days_to_D/365).
# This is a starter set from public data — extend it for your own categories.

- name: earthquake_m8_global
  keywords_all: [earthquake]
  keywords_any: ["8.0", "magnitude 8", "m8"]
  annual_probability: 0.63     # ~1 M8+ event per year worldwide (USGS: ~1/year on average)
  confidence: 0.5
  note: "USGS long-term average: ~1 M8+ per year worldwide"

- name: earthquake_m7_global
  keywords_all: [earthquake]
  keywords_any: ["7.0", "magnitude 7", "m7"]
  annual_probability: 0.999    # ~15 M7+ events per year worldwide
  confidence: 0.5
  note: "USGS: ~15 M7+ per year worldwide; edit by hand for a specific region"

- name: hurricane_cat5_us_landfall
  keywords_all: [hurricane]
  keywords_any: [category 5, cat 5, landfall]
  annual_probability: 0.25
  confidence: 0.4
  note: "~4 US Cat5 landfalls over ~100 years of records, trend-adjusted"

- name: btc_drawdown_30pct_month
  keywords_all: [bitcoin]
  keywords_any: [crash, "-30%", drop 30, fall 30]
  annual_probability: 0.55
  confidence: 0.35
  note: "Monthly BTC drawdowns >=30% occurred in ~8% of historical months"

- name: sovereign_default
  keywords_all: [default]
  keywords_any: [sovereign, debt, imf]
  annual_probability: 0.03
  confidence: 0.3
  note: "1-3 sovereign defaults per year across ~200 countries; per-country by hand"

- name: us_government_shutdown
  keywords_all: [government shutdown]
  keywords_any: []
  annual_probability: 0.35
  confidence: 0.45
  note: "~7 shutdowns in 20 years, clustered around budget deadlines"

- name: leader_leaves_office_early
  keywords_all: []
  keywords_any: [resign, impeach, "removed from office", "step down"]
  annual_probability: 0.04
  confidence: 0.3
  note: "Early exit of a head of state/CEO is rare, ~2-5%/year"

- name: new_country_conflict
  keywords_all: []
  keywords_any: [invade, invasion, "declare war", "military strike", missile strike]
  annual_probability: 0.05
  confidence: 0.25
  note: "A new interstate armed conflict for a country pair — a rough estimate"

- name: pandemic_declaration
  keywords_all: []
  keywords_any: [pandemic, "public health emergency of international concern", pheic]
  annual_probability: 0.10
  confidence: 0.3
  note: "PHEIC declared ~7 times in 15 years"

- name: volcano_vei5
  keywords_all: [volcano]
  keywords_any: [erupt, eruption]
  annual_probability: 0.5
  confidence: 0.35
  note: "VEI5+ eruptions ~once every 2 years worldwide; per-volcano by hand"
