# Parameters for the "barbell on the mispricing of tail outcomes" strategy.
# No secrets here, ever — keys go only in .env.
#
# PROFILE: moderate-aggressive (~2x). Bigger sizing, wider fade, larger MM
# quotes, faster cycle — vs the conservative code defaults. The edge discipline
# is unchanged (no buying overpriced tails) and the kill-switch stays, just with
# more room. Expect bigger swings (drawdowns of ~15-20%, not ~5%).

scanner:
  price_min: 0.002            # below this — dead markets, impossible to buy
  price_max: 0.05             # tail: implied probability <= 5%
  min_volume_24h_usd: 5000
  min_book_depth_usd: 500     # bid depth within 20% of mid
  book_depth_pct_from_mid: 0.20
  min_days_to_resolution: 3   # shorter — no time for a catalyst
  max_days_to_resolution: 120 # longer — capital lock-up kills IRR
  require_resolution_clarity: true
  min_description_chars: 80
  exclude_keywords: []
  include_keywords: []
  verify_book_depth: true
  interval_minutes: 10        # AGGR: scan every 10 min (was 20) — more responsive
  max_candidates_per_cycle: 200

estimator:
  min_edge_ratio: 2.0         # p_est / p_mkt >= 2 — otherwise no trade
  max_p_mkt: 0.05
  base_rates_file: base_rates.yaml
  market_anchor_confidence: 0.85
  platt_enabled: true         # recalibrate p_est on realized outcomes (auto-fitted)
  llm:
    enabled: false            # enable after calibrating base rates + coherence
    model: claude-sonnet-5
    max_calls_per_cycle: 10
    cache_ttl_hours: 24
    max_tokens: 1024

portfolio:
  bankroll_usd: 5000
  kelly_fraction: 0.30        # AGGR: half-Kelly (was 0.15) — 2x sizing
  max_market_pct: 0.025       # AGGR: <= 2.5% of bankroll per market (was 1%)
  max_category_pct: 0.20      # AGGR: <= 20% per category (was 10%)
  max_total_exposure_pct: 0.50  # AGGR: <= 50% deployed (was 30%)
  max_drawdown_pct: 0.25      # drawdown >= 25% -> observe-only + alert (soft brake)
  take_profit_multiple: 7.0   # partial take on an N-x rise
  take_profit_fraction: 0.6

executor:
  max_reprices: 3
  fill_timeout_sec: 90
  poll_interval_sec: 5
  max_child_order_usd: 200    # split large orders

# Strategy #1: structural arbitrage of neg-risk baskets.
# Nearly risk-free, but capacity is microscopic; windows are eaten by fast bots.
arbitrage:
  enabled: true
  execute: false            # true = place orders; false = only find and alert
  interval_sec: 60
  min_profit_pct: 0.015     # at least 1.5% NET edge (after fees)
  suspicious_gross_edge: 0.05  # gross above this -> likely incomplete basket, do not execute
  prefilter_tolerance: 0.01
  max_stake_usd: 300
  min_sets: 5
  max_legs: 20
  max_events_per_cycle: 10
  min_leg_volume_24h_usd: 500

# CORE (80% of capital): market making + liquidity rewards farming.
# Three income streams: spread + maker rebate + daily rewards pool.
market_maker:
  enabled: true             # AGGR: on (test in paper first!)
  interval_sec: 30
  max_markets: 5
  min_volume_24h_usd: 10000 # AGGR: was 50000 — quote more (rewards) markets
  min_days_to_resolution: 30
  require_rewards_program: true
  max_daily_midpoint_move: 0.05
  half_spread: 0.01
  quote_size_usd: 25        # AGGR: $25 per quote (was $10) — fills matter more
  inventory_skew_k: 0.5     # main risk mechanism: shift fair against inventory
  vol_spread_k: 10.0        # MM 2.0: widen spread by 10x realized sigma (Avellaneda-Stoikov)
  rewards_weighting: true   # MM 2.0: allocate quote size across markets by rewards score
  requote_threshold_ticks: 2  # hysteresis: do not burn rate limit or rewards sampling
  requote_timer_sec: 120
  requote_min_fill_prob: 0.25 # keep an order likely to fill instead of losing its queue
  guard_price_move: 0.03    # adverse selection: pull quotes on a shock
  guard_cooldown_cycles: 3
  guard_volume_ratio: 0.5

# Risk framework: absolute limits, kill-switch (halt until manual restart).
# AGGR: limits scaled ~2x, drawdown halt loosened 15% -> 30% (ladder: observe-only
# at 25% first, then hard halt at 30%). The kill-switch stays — just more room.
risk:
  max_position_per_market_usd: 125
  max_global_exposure_usd: 1500
  max_daily_loss_usd: 60
  max_drawdown_pct: 0.30
  min_edge_after_fees: 0.005  # AGGR: MM quotes tighter (was 0.01) -> more fills
  reconcile_interval_sec: 60
  ws_staleness_kill_sec: 10

# Fee Structure V2 (March 2026): maker pays 0 and earns a rebate.
# VERIFY it is current at docs.polymarket.com (Phase 0).
fees:
  taker:
    crypto: 0.07
    sports: 0.03
    finance: 0.04
    politics: 0.04
    tech: 0.04
    economics: 0.05
    culture: 0.05
    weather: 0.05
    geopolitics: 0.0
    other: 0.04
  maker_rebate_frac: 0.35

# WS order books: auto-reconnect, heartbeat, gap-detect (>10s -> pull quotes).
ws:
  enabled: true
  url: wss://ws-subscriptions-clob.polymarket.com/ws/market
  ping_interval_sec: 10

ratelimit:
  orders_per_sec: 20
  orders_burst: 100
  reads_per_sec: 30
  reads_burst: 100

# SATELLITE (20%): T-10s TA on 5-min BTC up/down. DISABLED by default.
satellite:
  enabled: false
  slug_template: "btc-updown-5m-{ts}"
  window_sec: 300
  entry_from_sec: 30
  entry_to_sec: 10
  edge_threshold: 0.05
  kelly_fraction: 0.25      # quarter-Kelly
  max_bet_usd: 10
  candles_url: "https://api.binance.com/api/v3/klines?symbol=BTCUSDT&interval=1m&limit=30"

# Strategy #2: cross-platform divergences (Kalshi). Alerts only:
# a human reconciles the venues' resolution rules.
crossmarket:
  enabled: true
  interval_min: 15
  min_divergence: 0.04      # from 4 pp
  min_similarity: 0.65
  min_volume_24h_usd: 10000
  max_alerts_per_cycle: 10

# Strategy #5: informational edge in a niche — instant alerts on new markets.
# Edit the watchlists for your own domains (default: post-Soviet geopolitics + crypto).
niche:
  enabled: true
  watchlists:
    - name: post-soviet
      keywords: [russia, ukraine, belarus, kazakhstan, armenia, azerbaijan,
                 georgia, moldova, putin, zelensky, lukashenko, kremlin,
                 donbas, crimea, baltic, latvia, lithuania, estonia]
    - name: crypto
      keywords: [bitcoin, btc, ethereum, eth, solana, crypto, stablecoin,
                 binance, coinbase, tether, sec etf, halving, defi]
    - name: ai
      keywords: [ai, openai, chatgpt, gpt, anthropic, claude, gemini, deepmind,
                 agi, llm, grok, xai, nvidia, sora, artificial intelligence,
                 large language model]
    - name: football-eu
      keywords: [champions league, premier league, la liga, serie a, bundesliga,
                 ligue 1, europa league, uefa, ballon, real madrid, barcelona,
                 man city, manchester city, manchester united, man united,
                 liverpool, arsenal, chelsea, tottenham, bayern, dortmund,
                 psg, juventus, inter milan, ac milan, napoli, atletico madrid]

# Smart-money tracker: alerts when strong wallets enter a market.
# Take addresses from polymarket.com/leaderboard (consistently profitable players).
smart_money:
  enabled: false
  interval_min: 10
  watch_wallets: []          # ["0x...", "0x..."] — who to follow
  min_position_usd: 50
  tail_max_price: 0.10       # entry cheaper than this — [TAIL] tag
  only_niche_or_tail: false  # true = alert only on niche/tail

# Fading overpriced tails: buy NO when the YES tail is overpriced
# (the profitable side of favorite-longshot bias). Positive on average, but
# with a rare large loss — held in check by the portfolio's hard caps.
fade:
  enabled: true
  bias_discount: 0.40       # AGGR: assume tails overpriced by 40% (was 30%) — wider + deeper
  fade_max_price: 0.10      # fade only YES tails cheaper than this price
  min_tail_price: 0.005
  min_edge_after_fees: 0.003  # AGGR: accept thinner edges (was 0.005) -> more trades
  longshot_veto_ratio: 2.0  # p_est >= 2x market -> a real longshot, do not fade
  max_days_to_resolution: 14  # AGGR: near-term only — fast capital recycling (higher IRR).
                              # Lower (7) = even faster but fewer tails; raise (30) for more.

ops:
  metrics_enabled: true     # Prometheus /metrics + /health on the port below
  metrics_port: 9090
  metrics_bind: "127.0.0.1" # /metrics shows equity/PnL — bind localhost unless
                            # firewalled; use "0.0.0.0" inside Docker

runtime:
  gamma_host: https://gamma-api.polymarket.com
  clob_host: https://clob.polymarket.com
  data_api_host: https://data-api.polymarket.com
  chain_id: 137
  request_timeout_sec: 30
  max_retries: 4

backtest:
  max_markets: 300
  lookback_days_before_end: 21
