# Параметры стратегии «барбелл на мисспрайсинге хвостовых исходов».
# Секретов здесь нет и быть не должно — ключи только в .env.

scanner:
  price_min: 0.002            # ниже — мёртвые рынки, купить нереально
  price_max: 0.05             # хвост: имплайд-вероятность ≤ 5%
  min_volume_24h_usd: 5000
  min_book_depth_usd: 500     # глубина бидов в пределах 20% от mid
  book_depth_pct_from_mid: 0.20
  min_days_to_resolution: 3   # короче — катализатору нет времени
  max_days_to_resolution: 120 # длиннее — заморозка капитала убивает IRR
  require_resolution_clarity: true
  min_description_chars: 80
  exclude_keywords: []
  include_keywords: []
  verify_book_depth: true
  interval_minutes: 20
  max_candidates_per_cycle: 200

estimator:
  min_edge_ratio: 2.0         # p_est / p_mkt ≥ 2 — иначе не сделка
  max_p_mkt: 0.05
  base_rates_file: base_rates.yaml
  market_anchor_confidence: 0.85
  llm:
    enabled: false            # включать после калибровки base rates + когерентности
    model: claude-sonnet-5
    max_calls_per_cycle: 10
    cache_ttl_hours: 24
    max_tokens: 1024

portfolio:
  bankroll_usd: 5000
  kelly_fraction: 0.15        # λ дробного Келли
  max_market_pct: 0.01        # ≤ 1% банка на рынок
  max_category_pct: 0.10      # ≤ 10% на категорию (с учётом корреляций)
  max_total_exposure_pct: 0.30
  max_drawdown_pct: 0.25      # просадка ≥ 25% → observe-only + алерт
  take_profit_multiple: 7.0   # частичная фиксация при росте в N раз
  take_profit_fraction: 0.6

executor:
  max_reprices: 3
  fill_timeout_sec: 90
  poll_interval_sec: 5
  max_child_order_usd: 200    # дробление крупных заявок

# Стратегия №1: структурный арбитраж neg-risk корзин.
# Почти безрисковый, но capacity микроскопический; окна выедаются быстрыми ботами.
arbitrage:
  enabled: true
  execute: false            # true = ставить ордера; false = только находить и алертить
  interval_sec: 60
  min_profit_pct: 0.015     # покрывает риск неисполнения ноги
  prefilter_tolerance: 0.01
  max_stake_usd: 300
  min_sets: 5
  max_legs: 20
  max_events_per_cycle: 10
  min_leg_volume_24h_usd: 500

# Стратегия №3: маркет-мейкинг — единственная, где типичный месяц плюс.
# База денежного потока портфеля. Включать осознанно: держит капитал в котировках.
market_maker:
  enabled: false
  interval_sec: 45
  max_markets: 8
  price_lo: 0.10            # котируем средние рынки, не хвосты
  price_hi: 0.90
  min_volume_24h_usd: 20000
  min_days_to_resolution: 2
  half_spread: 0.01
  quote_size_usd: 50
  inventory_cap_usd: 150
  guard_price_move: 0.03    # защита от adverse selection: снять котировки при шоке
  guard_cooldown_cycles: 3
  guard_volume_ratio: 0.5

# Стратегия №2: кросс-платформенные расхождения (Kalshi). Только алерты:
# правила резолюции площадок сверяет человек.
crossmarket:
  enabled: true
  interval_min: 15
  min_divergence: 0.04      # от 4 п.п.
  min_similarity: 0.65
  min_volume_24h_usd: 10000
  max_alerts_per_cycle: 10

# Стратегия №5: информационный edge в нише — мгновенные алерты о новых рынках.
# Вотчлисты редактируйте под свои домены (дефолт: постсоветская геополитика + крипто).
niche:
  enabled: true
  watchlists:
    - name: post-soviet
      keywords: [russia, ukraine, belarus, kazakhstan, armenia, azerbaijan,
                 georgia, moldova, putin, zelensky, lukashenko, kremlin,
                 donbas, crimea, baltic, latvia, lithuania, estonia]
    - name: crypto
      keywords: [bitcoin, btc, ethereum, eth, solana, crypto, stablecoin,
                 binance, coinbase, tether, sec etf, halving, defi]

runtime:
  gamma_host: https://gamma-api.polymarket.com
  clob_host: https://clob.polymarket.com
  data_api_host: https://data-api.polymarket.com
  chain_id: 137
  request_timeout_sec: 30
  max_retries: 4

backtest:
  max_markets: 300
  lookback_days_before_end: 21
