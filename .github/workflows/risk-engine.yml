# The gate, on every push.
#
# The §3.1 benchmarks are the reason this file exists. They are the only
# thing standing between a refactor and a model that quietly understates
# liquidation risk, and until now they have run when someone remembered to
# run them. A benchmark suite that is not in CI is a benchmark suite that
# passes right up until the commit nobody checked.
#
# The journal parity job runs against a real Postgres, not SQLite with a
# Postgres-shaped schema. The difference is not theoretical: the resolver
# catches per-row failures and continues, which works on SQLite and silently
# poisons the rest of the batch on a real server unless the backend rolls
# back. Only a real server surfaced that.

name: risk engine

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.11"
  NODE_VERSION: "22"

jobs:
  lint:
    name: ruff
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - run: pip install ruff
      - run: ruff check risk_engine

  python-tests:
    name: pytest
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: risk_engine/requirements.txt
      - run: pip install -r risk_engine/requirements.txt
      - name: Full suite
        # -p no:cacheprovider: a cache directory written into a fresh checkout
        # is pure noise here, and it has masked a stale-import failure before.
        run: python -m pytest risk_engine/tests -q -p no:cacheprovider

  gate:
    name: "§3.1 benchmark gate"
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: risk_engine/requirements.txt
      - run: pip install -r risk_engine/requirements.txt
      - name: Run the gate
        # Exits non-zero on any failing benchmark. §10 forbids weakening one
        # to make it pass; if this job goes red the model changed, and the
        # question is which direction.
        run: python -m risk_engine.validation.cli benchmarks

  journal-parity:
    name: journal parity (real Postgres)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: ci
          POSTGRES_USER: ci
          POSTGRES_DB: ci
        options: >-
          --health-cmd "pg_isready -U ci"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: risk_engine/requirements.txt
      - run: pip install -r risk_engine/requirements.txt psycopg[binary]
      - name: Both backends, same tests
        env:
          HL_TEST_POSTGRES_DSN: postgresql://ci:ci@127.0.0.1:5432/ci
        run: |
          set -o pipefail
          python -m pytest risk_engine/tests/test_journal_backends.py \
            -q -p no:cacheprovider -rs | tee out.txt
          # A skip here is a false green, not an inconvenience: if the service
          # container never came up the fixture skips, pytest exits 0, and the
          # parity this job exists to check goes unchecked while the badge
          # stays green.
          if grep -qi "skipped" out.txt; then
            echo "::error::the Postgres half skipped — the DSN did not reach the fixture"
            exit 1
          fi

  backend:
    name: backend
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: services/backend/package-lock.json
      - working-directory: services/backend
        run: npm ci
      - working-directory: services/backend
        run: npx tsc -p tsconfig.json --noEmit
      - working-directory: services/backend
        run: npm test

  web:
    name: frontend
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - working-directory: apps/web
        run: npm ci
      - working-directory: apps/web
        run: npx tsc --noEmit
      - working-directory: apps/web
        env:
          BACKEND_URL: http://backend:8080
        run: npm run build
      - name: The standalone tree the image copies from must exist
        working-directory: apps/web
        run: test -f .next/standalone/server.js && test -d .next/static

  acceptance:
    name: "§9 Phase 3 acceptance"
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: services/backend/package-lock.json
      - run: pip install -r risk_engine/requirements.txt
      - working-directory: services/backend
        run: npm ci && npm run build
      - name: Kill the engine and check nothing stale is served
        # The acceptance criterion run the way it is phrased: start both real
        # processes, SIGKILL the engine, and assert the backend serves no
        # value rather than a cached one. Clock-injected unit tests cover the
        # 60 s and 5 min boundaries; only this covers a dead process.
        run: node services/backend/scripts/degradation-check.mjs

  images:
    name: docker build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      # These Dockerfiles have never been built: registry access was blocked
      # in the environment they were written in. This job is their first real
      # build, so treat an early failure here as expected rather than as a
      # regression.
      - run: docker build -f deploy/Dockerfile.engine -t hl-risk/engine:ci .
      - run: docker build -f deploy/Dockerfile.backend -t hl-risk/backend:ci .
      - run: docker build -f deploy/Dockerfile.web -t hl-risk/web:ci .
      - name: The engine must refuse an exposed bind with no token
        # The guard is unit-tested, but the image is what actually ships, and
        # an ENTRYPOINT or env mistake would leave an unauthenticated engine
        # listening on the container network with the unit test still green.
        run: |
          if docker run --rm hl-risk/engine:ci --host 0.0.0.0 --port 8787 --fixture 2>&1 | tee log.txt; then
            echo "engine started on 0.0.0.0 with no token — the bind guard is not reaching the image"
            exit 1
          fi
          grep -q "refusing to bind" log.txt
