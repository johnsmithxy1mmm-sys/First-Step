# ─────────────────────────────────────────────────────────────────────────
# Второй пример: готовый доходный объект (не пресейл).
# Демонстрирует выход через КАПИТАЛИЗАЦИЮ ДОХОДА (cap rate) и рекомендацию
# ACQUIRE — в отличие от park.yaml (пресейл, выход через прирост цены).
# ─────────────────────────────────────────────────────────────────────────

object:
  name: "Резиденция «Поляна»"
  developer: "ГК «Альпика»"
  zone: "Красная Поляна · Роза Хутор"
  type: "сервисные апартаменты"
  area_m2: 48

purchase:
  price_rub: 15500000
  installment:
    down_payment_pct: 100         # готовый объект: оплата единовременно
    schedule:
      - {month: 0, pct: 100}

operations:
  rental_rate_rub_month: 165000   # курортная аренда, ₽/мес
  occupancy_pct: 82
  opex_pct_of_revenue: 24
  rental_growth_pct: 7
  rent_start_month: 0             # доход со старта (объект введён)

exit:
  hold_years: 5
  exit_cap_rate_pct: 7           # доходный подход; тезис — компрессия ставки
  selling_cost_pct: 3

assumptions:
  discount_rate_pct: 14
  target_irr_pct: 15

monte_carlo:
  iterations: 10000
  seed: 42
  ranges:
    occupancy_pct:     {dist: triangular, low: 70, mode: 82, high: 90}
    rental_growth_pct: {dist: normal, mean: 7, sd: 2}
    exit_cap_rate_pct: {dist: triangular, low: 6.5, mode: 7, high: 8}

advisor:
  recommendation: "ACQUIRE"
  thesis: "Действующий денежный поток в премиум-локации; чистая доходность 8 % и компрессия ставки капитализации к выходу покрывают целевой порог."
  exit_scenario: "Удержание 5 лет на арендном потоке, выход по сжатой рыночной капитализации (≈7 %)"
