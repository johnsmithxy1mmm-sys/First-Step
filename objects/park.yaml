# ─────────────────────────────────────────────────────────────────────────
# Конфиг объекта для инвестиционного меморандума.
# Заполните параметры и запустите:  python generate.py objects/park.yaml
# Все допущения явные и редактируемые. Значения по умолчанию — разумные.
# ─────────────────────────────────────────────────────────────────────────

object:
  name: "МФК «Парк»"
  developer: "ГК «Десо»"
  zone: "Сочи · Центральный"
  type: "апарт-комплекс"
  area_m2: 34

purchase:
  price_rub: 18900000
  installment:                  # график рассрочки = отрицательные потоки по датам
    down_payment_pct: 30        # сверяется с траншами месяца 0
    schedule:                   # остаток разбит по месяцам/траншам; доли -> 100 %
      - {month: 0,  pct: 30}
      - {month: 12, pct: 35}
      - {month: 24, pct: 35}

operations:
  rental_rate_rub_month: 95000  # базовая ставка аренды, ₽/мес
  occupancy_pct: 70             # загрузка, %
  opex_pct_of_revenue: 28       # УК, налоги, обслуживание, % от выручки
  rental_growth_pct: 6          # годовой рост ставки, %
  rent_start_month: 24          # доход с момента ввода (рассрочка «до ввода»)

exit:
  hold_years: 7
  # Способ оценки выхода. Для этого актива тезис — прирост стоимости, поэтому
  # используем рост цены (сложный годовой %). Альтернатива — капитализация
  # дохода: закомментируйте строку ниже и раскомментируйте exit_cap_rate_pct.
  exit_price_growth_pct: 8      # годовой рост цены объекта, %
  # exit_cap_rate_pct: 9        # доходный подход (альтернатива росту цены)
  selling_cost_pct: 4           # издержки продажи, %

assumptions:
  discount_rate_pct: 18         # ставка дисконтирования, %
  target_irr_pct: 15            # порог для оценки «вероятность недобора»

monte_carlo:
  iterations: 10000
  seed: 42                      # фиксируем для воспроизводимости
  ranges:                       # стохастические входы: triangular | normal | uniform
    occupancy_pct:         {dist: triangular, low: 55, mode: 70, high: 82}
    rental_growth_pct:     {dist: normal, mean: 6, sd: 2}
    exit_price_growth_pct: {dist: triangular, low: 5, mode: 8, high: 11}

advisor:
  recommendation: "HOLD"        # ACQUIRE | HOLD | AVOID
  thesis: "Рассрочка до ввода без удорожания; на текущем прайсе — удержание."
  exit_scenario: "Перепродажа на вводе, +18–22 %"
